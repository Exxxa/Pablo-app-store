version: "2.1.0"
category: files
name: Recipe Book
tagline: Self-hosted family recipe manager with Claude AI integration
icon: https://raw.githubusercontent.com/Exxxa/Pablo-app-store/master/sparkles-recipe-website/icon.png
description: >-
  private recipe book for a family, kept at home. Each recipe is a card with
  its photos, where it comes from, who passed it on, tags, nutrition and a
  logbook of the times it was cooked. Search covers titles, ingredients and
  tags, and can start from what is in the fridge or what is in season in France.
  A cooking mode shows one step at a time with timers and keeps the screen on.


  Each member also gets a Routine: a weekly planner for meals and workouts with
  a daily checklist. Claude can be connected through a personal MCP link to find
  recipes, add new ones, plan the week or log a meal on request.

