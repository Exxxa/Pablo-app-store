releaseNotes: >-
  A new look, a private book, and safer data.


  For everyone:

  - New design: every recipe is a card, filed by course, in light or dark.

  - Cooking mode: one step at a time, with timers, and the screen stays on.

  - The book is now private. You need to sign in to read recipes, notes and photos.

  - You can change your password in Settings. If you forget it, ask the admin for a reset link.

  - Logbook: add a note each time you cook a recipe, and record a dish cooked on an earlier day.

  - Tags and any country of origin on a recipe, with matching filters in the library.

  - Routine: each person sets their own weekly template for meals and workouts.

  - Recently opened recipes stay readable without a network when the site is opened over HTTPS.

  - Claude sees your Routine as the page shows it, can plan meals from recipes in the book, find what to cook from what you have, and record a cooked dish. Changes made by Claude and changes made on the page no longer overwrite each other.


  For the admin:

  - Backups: the database is copied every night and before each update, and a full backup (recipes, photos, accounts) can be downloaded from Administration.

  - You can edit or delete any recipe. Deleting an account keeps its recipes.

  - Administration has a switch to open the book to visitors again.
